name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to update the latest release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # ---------- Build web app with env vars ----------
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ---------- Verify build output (debug) ----------
      - name: Verify dist folder
        run: |
          ls -la dist/
          test -f dist/index.html && echo "✅ dist/index.html found" || (echo "❌ dist/index.html MISSING" && exit 1)

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      # No need to install @capacitor/filesystem – it's already in package.json
      - name: Capacitor Sync
        run: npx cap sync android

      # ---------- Verify Capacitor copied files ----------
      - name: Verify Capacitor copy
        run: |
          ls -la android/app/src/main/assets/public/
          test -f android/app/src/main/assets/public/index.html && echo "✅ Copied successfully" || echo "❌ NOT copied!"

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Rename APK to HyecodeEditor.apk
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/HyecodeEditor.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyecodeEditor
          path: android/app/build/outputs/apk/debug/HyecodeEditor.apk

      - name: Upload APK to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Hyecode Editor – Latest Build"
          prerelease: true
          draft: false
          files: android/app/build/outputs/apk/debug/HyecodeEditor.apk
          allowUpdates: true
          replacesArtifacts: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
